{% extends 'base.html' %}
{% block content %}
  <div class="auth-card">
    <h2>Create your account</h2>
    <p class="muted">Start tracking your games in seconds.</p>
    {% if error %}<div class="alert-banner" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="auth-form">
      <label>Display name
        <input type="text" name="display_name" autocomplete="nickname" placeholder="optional" />
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" required autofocus />
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="new-password"
               minlength="8" required />
        <span class="field-hint muted">At least 8 characters.</span>
      </label>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="/login">Log in</a></p>
  </div>
{% endblock %}
