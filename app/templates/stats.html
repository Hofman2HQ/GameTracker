{% extends 'base.html' %}
{% block content %}
  <h2>Stats</h2>
  <div class="stats">
    <div class="stat">Total: <strong>{{ total }}</strong></div>
    {% for k, v in totals.items() %}
      <div class="stat">{{ k }}: <strong>{{ v }}</strong></div>
    {% endfor %}
    <div class="stat">Avg Rating: <strong>{{ avg_rating if avg_rating is not none else '—' }}</strong></div>
    <div class="stat">Hours Played: <strong>{{ hours }}</strong></div>
  </div>
{% endblock %}
